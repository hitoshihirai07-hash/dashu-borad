<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#24634b"><meta name="description" content="30分単位で時間を記録。端末内に保存し、ファイルで共有できる自分のためのダッシュボード。"><title>ときの記録 | 時間ダッシュボード</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%2324634b'/%3E%3Ccircle cx='20' cy='20' r='13' fill='none' stroke='white' stroke-width='2'/%3E%3Cpath d='M20 11v10l6 4' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E"><style>/* STYLES */</style></head>
<body><a href="#main" class="skip">本文へ移動</a><aside class="sidebar"><a class="brand" href="#dashboard"><span data-icon="clock"></span>ときの記録</a><nav aria-label="メインナビゲーション"><a href="#dashboard" data-nav="dashboard"><span data-icon="home"></span><span>ダッシュボード</span></a><a href="#records" data-nav="records"><span data-icon="list"></span><span>記録一覧</span></a><a href="#share" data-nav="share"><span data-icon="share"></span><span>データ共有</span></a></nav><div class="sidebar-foot"><span data-icon="save"></span><span>この端末に保存<small>あなたの時間を、あなたの手元に。</small></span></div></aside><div class="workspace"><div class="topbar"><span>自分のペースで、積み重ねる。</span><span id="save-status"><i></i>ローカル保存</span></div><main id="main" tabindex="-1"></main><footer>記録はこのブラウザー内に保存されます。<a href="#share">ファイルでバックアップ・共有</a></footer></div><dialog id="record-dialog" aria-labelledby="record-title"><form id="record-form"><div class="dialog-heading"><h2 id="record-title">時間を記録</h2><button type="button" class="icon-button" data-close="record-dialog" aria-label="閉じる"><span data-icon="close"></span></button></div><p class="muted">今日の積み重ねを、30分単位で。</p><label>日付<input name="date" type="date" min="1900-01-01" max="2200-12-31" required></label><label>活動名<input name="activity" list="activities" placeholder="例：ブログ更新、動画編集" maxlength="80" required autocomplete="off"></label><datalist id="activities"></datalist><label>時間<select name="minutes"></select></label><label>メモ <span class="muted">（任意）</span><textarea name="note" rows="3" maxlength="2000" placeholder="取り組んだこと、気づいたことなど"></textarea></label><p id="form-error" class="error" role="alert"></p><div class="dialog-actions"><button type="button" class="button secondary" data-close="record-dialog">キャンセル</button><button class="button primary" type="submit">保存する</button></div></form></dialog><dialog id="merge-dialog" aria-labelledby="merge-title"><div class="dialog-heading"><h2 id="merge-title">読み込む記録を確認</h2><button class="icon-button" data-close="merge-dialog" aria-label="閉じる"><span data-icon="close"></span></button></div><div id="merge-content"></div><p id="merge-error" class="error" role="alert"></p><div class="dialog-actions"><button class="button secondary" data-close="merge-dialog">キャンセル</button><button class="button primary" id="merge-apply">統合して保存</button></div></dialog><dialog id="delete-dialog" aria-labelledby="delete-title"><div class="dialog-heading"><h2 id="delete-title">この記録を削除しますか？</h2></div><p id="delete-description"></p><p class="muted">削除済みの一覧から元に戻せます。削除状態も共有ファイルに含まれます。</p><div class="dialog-actions"><button class="button secondary" data-close="delete-dialog">キャンセル</button><button class="button danger" id="delete-apply">削除する</button></div></dialog><input id="import-file" type="file" accept=".json,application/json" hidden><div id="toast" class="toast" role="status" aria-live="polite" hidden></div><noscript>このサイトを使うには、ブラウザーのJavaScriptを有効にしてください。</noscript><script>/* SCRIPT */</script></body></html>
